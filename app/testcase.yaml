common:
  platform_allow:
    - mps2/an385
  timeout: 120
  harness: console
  
  

tests:
  swifi.msgq.baseline:
    tags: msgq    
    extra_configs:
      - CONFIG_FI_ENABLE=n
      - CONFIG_WL_MSGQ=y
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - 'ricevuto value=42'  
        - '\[RUN\] END'
      record:
        regex:
          - 'CANARY after (?P<op_canary>\w+)#(?P<n_canary>\d+). (?P<canary_status>\w+)'
          - 'CANARY after put#(?P<n_put>\d+). CORROTTA: (?P<byte_corrotti>\d+) byte su (?P<byte_totali>\d+)[^0-9]+(?P<primo>\d+) a (?P<ultimo>\d+)'
          - 'get#(?P<n_get>\d+): ret=(?P<ret_get>-?\d+)[^=]+=(?P<valore>\d+)'
          - '.CODA after (?P<op>\w+)#(?P<n_op>\d+)[^0-9-]+(?P<used>\d+)[^0-9-]+(?P<write_off>-?\d+)[^0-9-]+(?P<read_off>-?\d+)'
          - '\[FI\] inject target=(?P<target>\w+) mode=(?P<mode>\d+) orig=(?P<orig>0x[0-9a-fA-F]+) new=(?P<new>0x[0-9a-fA-F]+)'
          - '\[FI\] done ret=(?P<ret_op>-?\d+)'
 
  swifi.msgq.msgsize.badarg4.assert_off:
